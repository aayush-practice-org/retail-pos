services:
  database:
    container_name: postgres_mart_db
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    env_file:
      - .env

    volumes:
      - postgres_mart_db:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql


  mart_app:
    build: .
    container_name: mart_app

    env_file:
      - .env

    ports:
      - "1200:1200"

    environment:
      DATASOURCE_URL: jdbc:postgresql://database:5432/mart_app

volumes:
  postgres_mart_db:
