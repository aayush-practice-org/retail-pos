spring:
  application:
    name: mart-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/mart}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  hikari:
      connection-timeout: 30000
      maximum-pool-size: 20

  flyway:
    user: ${FLYWAY_USER:${DATASOURCE_USERNAME:postgres}}
    password: ${FLYWAY_PASSWORD:${DATASOURCE_PASSWORD:postgres}}
    enabled: true
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Row level security stays off until the identity/tenant module lands
  rls:
    enabled: false

app:
  token:
    secret: ${APP_TOKEN_SECRET:change-me-dev-secret-32bytes-min}
    expiration-hours: ${APP_TOKEN_EXPIRATION_HOURS:24}
  default-admin:
    enabled: ${DEFAULT_ADMIN_ENABLED:true}
    username: ${DEFAULT_ADMIN_USERNAME:admin}
    password: ${DEFAULT_ADMIN_PASSWORD:admin}
    email: ${DEFAULT_ADMIN_EMAIL:admin@mart.local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  show-actuator: false

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: info
    io.aygh: info

server:
  port: 1200
