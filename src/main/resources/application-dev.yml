spring:
  application:
    name: mart-service

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

    hikari:
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT}
      idle-timeout: ${DATASOURCE_IDLE_TIMEOUT}


  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    enabled: true
    locations: classpath:db/migration/public
    schemas: public
    default-schema: public
    out-of-order: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

app:
  token:
    secret: ${APP_TOKEN_SECRET}
    expiration-hours: ${APP_TOKEN_EXPIRATION_HOURS}
  default-admin:
    enabled: ${DEFAULT_SUPERADMIN_ENABLED}
    username: ${DEFAULT_SUPERADMIN_USERNAME}
    password: ${DEFAULT_SUPERADMIN_PASSWORD}
    email: ${DEFAULT_SUPERADMIN_EMAIL}
    full-name: ${DEFAULT_SUPERADMIN_FULL_NAME}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  show-actuator: false

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: info
    io.aygh: info

server:
  port: 1200
